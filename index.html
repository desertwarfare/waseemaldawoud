<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT PERSONAL RESUME</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap">
    <style>
        :root {
            --neon-blue: #0ff0fc;
            --neon-pink: #ff2a6d;
            --neon-purple: #d300c5;
            --dark-bg: #0d0221;
            --darker-bg: #02010a;
            --text: #b5b5b5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            line-height: 1.6;
            padding: 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 109, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(13, 240, 252, 0.05) 0%, transparent 20%);
        }

        .cyber-container {
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(13, 240, 252, 0.3),
                        0 0 40px rgba(211, 0, 197, 0.2);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .cyber-container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px dashed var(--neon-pink);
            opacity: 0.5;
            pointer-events: none;
            animation: pulse 6s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
        }

        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            margin-bottom: 0.8rem;
            word-break: break-word;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            letter-spacing: 3px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        h2 {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            border-bottom: 1px solid var(--neon-pink);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        h3 {
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px var(--neon-blue); }
            to { text-shadow: 0 0 15px var(--neon-blue), 0 0 20px var(--neon-purple); }
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .contact-info span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .contact-info i {
            color: var(--neon-purple);
        }

        section {
            margin-bottom: 1.5rem;
            position: relative;
        }

        ul {
            list-style-type: none;
            padding-left: 1rem;
        }

        ul li::before {
            content: "▹";
            color: var(--neon-pink);
            display: inline-block;
            width: 1em;
            margin-left: -1em;
        }

        .project, .education-item, .certification {
            background: rgba(13, 2, 33, 0.7);
            border-left: 3px solid var(--neon-blue);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .project:hover, .education-item:hover, .certification:hover {
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(13, 240, 252, 0.2);
        }

        .project h4 {
            color: var(--neon-purple);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            font-size: clamp(1rem, 3vw, 1.1rem);
        }

        .project h4::before {
            content: ">_ ";
            color: var(--neon-blue);
        }

        .skills-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .skill-category {
            flex: 1;
            min-width: 0;
        }

        .print-btn {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: var(--neon-pink);
            color: black;
            border: none;
            padding: 0.5rem 1rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .print-btn:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        @media print {
            body {
                background: white;
                color: black;
            }
            .cyber-container {
                border: none;
                box-shadow: none;
            }
            h1, h2, h3 {
                color: black;
                text-shadow: none;
            }
            .print-btn {
                display: none;
            }
        }
        
        /* Profile Image Styles */
        .profile-pic-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            position: relative;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue),
                        0 0 30px var(--neon-purple);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .profile-pic-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--neon-blue),
                        0 0 40px var(--neon-purple);
        }

        #profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .profile-pic-container::before {
            content: "";
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px dashed var(--neon-pink);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        /* Terminal effect */
        .typing {
            border-right: 3px solid var(--neon-blue);
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--neon-blue); }
        }

        /* Gallery styles */
        .gallery {
            margin-bottom: 1.5rem;
        }
        
        .gallery img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--neon-purple);
            margin-top: 0.5rem;
        }
        
        iframe {
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        /* Media queries for larger screens */
        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }
            
            .cyber-container {
                padding: 2rem;
            }
            
            .contact-info {
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
                gap: 1rem;
            }
            
            .skills-container {
                flex-direction: row;
            }
            
            .print-btn {
                bottom: 2rem;
                right: 2rem;
            }
        }
    </style>
</head>
<body>
WORK IN PROGRESS
</body>
</html>
